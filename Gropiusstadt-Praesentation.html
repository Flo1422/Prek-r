chert"},s6:{stamp:"SCHWER ERZIEHBAR",question1:"SCHWER ERZIEHBAR?",question2:"ODER IN SCHWIERIGKEITEN?",conclusion:"VERSTEHEN STATT ABSTEMPELN."},s7:{title1:"NICHT NUR BELASTUNGEN.",title2:"AUCH STÄRKEN.",keywords:["Freundschaft","Zusammenhalt","Kreativität"],nodes:[{key:"freundschaft",label:"Freundschaft"},{key:"fussball",label:"Fußball"},{key:"musik",label:"Musik"},{key:"kunst",label:"Kunst"},{key:"unterstuetzung",label:"Unterstützung"}]},s8:{title:"TEILHABE DARF KEIN LUXUS SEIN.",rings:[{label:"Neukölln",value:54.4,tone:"amber"},{label:"Berlin",value:31.1,tone:"grey"}],items:["Mittagessen","Sport","Ausflüge","Lernförderung"],caption:"BuT-Anspruch von Grundschülern · 2024",source:"Quelle: Kinder- und Familienarmutsbericht Neukölln (2025) · Werte vor Vortrag prüfen"},s9:{title:"WAS KÖNNEN WIR TUN?",center:"HORT",actions:[{key:"beobachten",label:"Beobachten",hint:"Wahrnehmen, ohne zu bewerten"},{key:"vertrauen",label:"Vertrauen",hint:"Verlässliche Beziehung"},{key:"beteiligen",label:"Beteiligen",hint:"Teilhabe niedrigschwellig"},{key:"staerken",label:"Stärken",hint:"Ressourcen sichtbar machen"},{key:"begleiten",label:"Begleiten",hint:"Partnerschaft mit Eltern"}]},s10:{kicker:"UND JETZT?",question:"WAS WÜRDEST DU TUN?"},s11:{name:"SAM. 10 JAHRE.",place:"Hort in Gropiusstadt.",observationsLabel:"Beobachtungen",strengthsLabel:"Stärken",observations:[{key:"portionen",label:"Häufig zusätzliche Portionen"},{key:"schuhe",label:"Abgenutzte Schuhe"},{key:"ausflug",label:"Ausflug nicht besucht"},{key:"konflikte",label:"Konflikte in der Gruppe"}],strengths:[{key:"fussball",label:"Fußball"},{key:"zeichnen",label:"Zeichnen"},{key:"freunde",label:"Freundschaften"}]},s12:{title:"PERSPEKTIVEN WECHSELN.",countdown:6*60,groups:[{n:1,label:"Beobachtungen",task:"Was wissen wir tatsächlich? Was vermuten wir?",color:"#70D6C4"},{n:2,label:"Belastungen",task:"Welche möglichen Belastungen könnten eine Rolle spielen?",color:"#F3A65A"},{n:3,label:"Ressourcen",task:"Welche Stärken und Schutzfaktoren erkennen wir?",color:"#A7B8F5"},{n:4,label:"Handeln",task:"Wie können Fachkräfte im Hort konkret handeln?",color:"#E89A95"}],hint:"Karte antippen → Arbeitsauftrag"},s13:{title:"VERSTEHEN STATT VERURTEILEN.",countdown:5*60,questions:["Was wissen wir wirklich?","Wie vermeiden wir Beschämung?","Welche Stärken können wir fördern?","Wie beziehen wir die Eltern ein?","Wo liegen unsere Grenzen?"]},s14:{circles:[{key:"wahrnehmen",label:"WAHRNEHMEN.",placeholder:"Beobachtung ≠ Vermutung …",color:"#70D6C4"},{key:"verstehen",label:"VERSTEHEN.",placeholder:"Lebenslagen, Hintergründe …",color:"#A7B8F5"},{key:"handeln",label:"HANDELN.",placeholder:"Beziehung, Teilhabe, Eltern …",color:"#F3A65A"},{key:"staerken",label:"STÄRKEN.",placeholder:"Ressourcen, Selbstwirksamkeit …",color:"#E89A95"}],quote:"Kinder brauchen keine Fachkräfte, die ihre Familien vorschnell beurteilen, sondern Fachkräfte, die ihre Lebensrealitäten verstehen und ihnen Teilhabe ermöglichen.",exportTitle:"Ergebnissicherung – Fallbeispiel Sam (Gropiusstadt)"}},Me=[{id:"gropiusstadt",part:"A",title:"Gropiusstadt",duration:45,steps:0,notes:{paragraphs:["Gropiusstadt ist ein Berliner Stadtteil mit unterschiedlichen Familien, Lebensgeschichten und sozialen Lebensbedingungen.","Der Vortrag betrachtet beispielhaft, welche Herausforderungen prekäre Lebensverhältnisse für Familien und Kinder mit sich bringen können.","Der Schwerpunkt liegt auf Kindern im Grundschulalter und der professionellen Arbeit pädagogischer Fachkräfte im Hort.","LEITFRAGE: Welche Auswirkungen können prekäre Lebensverhältnisse auf das Aufwachsen und die Teilhabe von Kindern haben – und wie können Fachkräfte im Hort unterstützen?"],transition:"Bevor wir auf Zahlen schauen: Was meinen wir eigentlich mit „prekär“?",hints:["Ablauf kurz ansagen: 10 Minuten Input, danach 15 Minuten Fallarbeit und Diskussion."]}},{id:"prekaer",part:"A",title:"Was bedeutet prekär?",duration:60,steps:5,notes:{paragraphs:["Prekäre Lebensverhältnisse beschreiben unsichere wirtschaftliche und soziale Lebensbedingungen.","Sie können geprägt sein durch geringes Einkommen, unsichere Beschäftigung, Schulden, beengte Wohnverhältnisse und eingeschränkte gesellschaftliche Teilhabe.","Dabei geht es nicht ausschließlich um finanzielle Armut. Familien können in mehreren Lebensbereichen gleichzeitig Belastungen erfahren – die fünf Fenster stehen für diese Bereiche.","Wichtig ist eine differenzierte Betrachtung: Prekäre Lebensbedingungen bedeuten nicht automatisch schlechte Elternschaft oder fehlende familiäre Unterstützung."],transition:"Wie verbreitet ist das in Gropiusstadt? Ein Blick auf die Zahlen.",hints:["Mit jedem Klick leuchtet ein Fenster auf: Geld → Wohnen → Bildung → Teilhabe → Belastung."],sources:["Erzieherinnen + Erzieher, Band 1, Kapitel 3.5","Familienreport 2024 (BMFSFJ)"]}},{id:"zahlen",part:"A",title:"Kinderarmut in Zahlen",duration:75,steps:3,notes:{paragraphs:["Laut dem Kinder- und Familienarmutsbericht Neukölln lag der Anteil der Minderjährigen im SGB-II-Bezug 2024 in Berlin bei etwa 23,1 Prozent, in Neukölln bei 33,6 Prozent und in Gropiusstadt bei 37,3 Prozent.","In Gropiusstadt betrifft dieser Indikator somit mehr als ein Drittel der Minderjährigen.","SGB-II-Bezug ist jedoch nicht mit sämtlichen Formen von Armut gleichzusetzen – Familien knapp oberhalb der Grenze oder ohne Antrag tauchen hier nicht auf.","Die Zahlen beschreiben statistische Rahmenbedingungen und keine individuellen Familien."],transition:"Was bedeuten solche Zahlen im Alltag eines Kindes?",hints:["Klick 1: Berlin · Klick 2: Neukölln · Klick 3: Gropiusstadt.","„Gropiusstadt“ ist im Bericht ein Prognoseraum. Der Bericht nennt an anderer Stelle teils leicht abweichende Werte (andere Stichtage) – bei Nachfragen darauf hinweisen."],sources:["Kinder- und Familienarmutsbericht Neukölln (Bezirksamt Neukölln, 2025)"]}},{id:"lebenswelt",part:"A",title:"Die Lebenswelt eines Kindes",duration:75,steps:4,notes:{paragraphs:["Finanzielle Einschränkungen können sich auf unterschiedliche Lebensbereiche von Kindern auswirken.","Ernährung: Nicht jeden Tag gibt es selbstverständlich ein Frühstück oder eine ausgewogene Mahlzeit.","Lernen: Beengter Wohnraum kann dazu führen, dass ein ruhiger Arbeitsplatz fehlt. Auch Kosten für Lernmaterialien können eine Hürde sein.","Freizeit: Kosten für Sportvereine, Ausflüge oder Eintritte können die Teilhabe erschweren.","Wohlbefinden: Finanzielle Sorgen können Stress und Scham auslösen – auch bei Kindern.","Diese Folgen sind nicht zwangsläufig. Familiäre Beziehungen, Freundschaften und andere Schutzfaktoren können Belastungen abfedern."],transition:"Zahlen und Fachbegriffe sind das eine. Wie klingt das, wenn jemand selbst davon erzählt?",hints:["Jeder Klick hebt einen Bereich hervor und zeigt eine mögliche Alltagssituation. Bereiche lassen sich auch direkt anklicken."],sources:["Erzieherinnen + Erzieher, Band 1, Kapitel 3.5","Familienreport 2024 (BMFSFJ)"]}},{id:"rap",part:"A",title:"Rap als Stimme der Lebenswelt",duration:75,steps:1,notes:{paragraphs:["Der Song „Hellwach“ von TNF47 thematisiert unter anderem Erfahrungen mit finanziellen Einschränkungen, Ernährung und belastenden Lebensbedingungen.","Rapmusik bietet eine subjektive, künstlerische Perspektive auf soziale Erfahrungen.","Solche Texte sind keine wissenschaftlichen Belege und nicht automatisch vollständig autobiografisch.","Sie können aber helfen, pädagogische Fragestellungen lebensnah zu verdeutlichen."],transition:"Was bedeutet es für ein Kind, wenn grundlegende Bedürfnisse nicht selbstverständlich erfüllt werden?",hints:["Kein Audio – der Song wird nicht abgespielt.","Klick: Die Textstelle wird eingeblendet. Langsam vorlesen oder kurz wirken lassen.","Textstelle vor dem Vortrag wörtlich prüfen. Eintragen über den Stift-Knopf oben rechts auf der Folie (bleibt in diesem Browser gespeichert) oder dauerhaft in content.ts → copy.s5.quote.","Vor dem Zitat einordnen: subjektive, künstlerische Perspektive – kein Beleg, nicht automatisch autobiografisch.","Weitere Songs: Knopf „Songs zum Thema“ auf Ansicht 4, 6 und 7 oder Songgalerie (Taste M). Optional – nicht Teil der 10 Minuten."],sources:["TNF47 – „Hellwach“ (Credits und Release prüfen)"]}},{id:"stigma",part:"A",title:"Stigmatisierung",duration:60,steps:2,notes:{paragraphs:["In den Songs „Schmutz“, „Schule“ und „Schwer erziehbar“ werden unter anderem negative Zuschreibungen, schulische Konflikte und Erfahrungen mit Autoritätspersonen thematisiert.","Pädagogische Fachkräfte müssen zwischen Beobachtungen und Interpretationen unterscheiden.","Verhalten kann unterschiedliche Ursachen haben. Ein Kind sollte nicht durch negative Etiketten auf bestimmte Eigenschaften reduziert werden.","Die professionelle Aufgabe besteht darin, das Verhalten wahrzunehmen, mögliche Hintergründe zu verstehen und angemessen zu handeln."],transition:"Wer nur auf Defizite schaut, übersieht etwas Entscheidendes.",hints:["Klick 1: Stempel bricht auf → „Oder in Schwierigkeiten?“ · Klick 2: Kernaussage."],sources:["Luvre47 – „Schmutz“","Luvre47 – „Schule“","TNF47 & Luvre47 – „Schwer erziehbar“ (Credits zu prüfen)"]}},{id:"ressourcen",part:"A",title:"Ressourcen",duration:60,steps:2,notes:{paragraphs:["Der Song „Kylie“ von Luvre47, Bangs, Haki, Chapo und Almani thematisiert unter anderem Zusammenhalt, Freundschaft und gegenseitige Unterstützung.","Diese Perspektive ist wichtig, weil Familien und Kinder nicht ausschließlich über Defizite betrachtet werden dürfen.","Soziale Beziehungen, Interessen, Kreativität und positive Gruppenerfahrungen können wichtige Ressourcen sein.","Pädagogische Fachkräfte sollten vorhandene Stärken erkennen und fördern."],transition:"Damit Stärken sich entfalten können, braucht es Zugang. Stichwort: Teilhabe.",hints:["Klick 1: Szene wird hell, Netzwerk entsteht · Klick 2: Schlagwörter."],sources:["Luvre47, Bangs, Haki, Chapo & Almani – „Kylie“ (Credits zu prüfen)"]}},{id:"teilhabe",part:"A",title:"Bildung und Teilhabe",duration:50,steps:2,notes:{paragraphs:["2024 hatten in Neukölln 54,4 Prozent der Grundschülerinnen und Grundschüler Anspruch auf Leistungen aus dem Bildungs- und Teilhabepaket. Berlinweit waren es 31,1 Prozent.","Diese Zahlen beziehen sich auf Neukölln insgesamt, nicht ausschließlich auf Gropiusstadt.","Das Bildungs- und Teilhabepaket kann unter anderem Unterstützung bei Mittagessen, Ausflügen, Schulbedarf, Lernförderung und Freizeitaktivitäten ermöglichen.","Pädagogische Fachkräfte können Familien informieren und Teilhabebarrieren reduzieren."],transition:"Was heißt das konkret für unser Handeln im Hort?",hints:["Klick 1: Neukölln · Klick 2: Berlin.","ZU PRÜFEN: Die BuT-Werte (54,4 % / 31,1 %) stehen im Bericht in Abbildungen (ca. S. 63–64). Vor dem Vortrag dort abgleichen."],sources:["Kinder- und Familienarmutsbericht Neukölln (Bezirksamt Neukölln, 2025)"]}},{id:"handeln",part:"A",title:"Pädagogisches Handeln",duration:70,steps:5,notes:{paragraphs:["Pädagogische Fachkräfte im Hort können Kinder und Familien auf unterschiedliche Weise unterstützen.","Beobachten: aufmerksam wahrnehmen und Beobachtung von Deutung trennen.","Vertrauen: eine wertschätzende Haltung und verlässliche Beziehungen.","Beteiligen: niedrigschwellige Teilhabemöglichkeiten schaffen – etwa kostenfreie Angebote.","Stärken: ressourcenorientierte Angebote, die an Interessen der Kinder anknüpfen.","Begleiten: eine respektvolle Erziehungs- und Bildungspartnerschaft mit den Eltern.","Der Hort kann finanzielle Armut nicht allein beseitigen, aber konkrete Benachteiligungen im pädagogischen Alltag verringern."],transition:"Genug Theorie.",hints:["Jeder Klick hebt ein Handlungsfeld hervor. Felder lassen sich auch direkt anklicken."],sources:["Fachtext: Erziehungs- und Bildungspartnerschaft im Wandel","Erzieherinnen + Erzieher, Band 1, Kapitel 3.5"]}},{id:"uebergang",part:"A",title:"Übergang zur Praxis",duration:30,steps:1,notes:{paragraphs:["Nach der theoretischen Auseinandersetzung folgt eine fiktive Handlungssituation.","Die Studierenden sollen das Gelernte auf eine konkrete Situation aus dem Hortalltag übertragen."],transition:"Ich stelle euch Sam vor.",hints:["Klick: Die große Frage erscheint. Kurz Pause lassen.","Ab hier beginnt Teil B (15 Minuten)."]}},{id:"sam",part:"B",title:"Fallbeispiel Sam",duration:120,steps:7,notes:{paragraphs:["Sam ist zehn Jahre alt, besucht die vierte Klasse und geht nach der Schule in einen Hort in Gropiusstadt.","Seit einigen Wochen fragt Sam beim Mittagessen häufig nach einer zusätzlichen Portion.","Sam trägt seit längerer Zeit dieselben abgenutzten Schuhe und konnte an einem kostenpflichtigen Ausflug nicht teilnehmen.","In Gruppensituationen kommt es gelegentlich zu Streit. Einmal reagierte Sam sehr wütend, als andere Kinder über die Schuhe lachten.","Gleichzeitig spielt Sam leidenschaftlich Fußball, zeichnet gern und hat zwei enge Freundschaften.","Bei kreativen Projekten zeigt Sam viel Ausdauer und übernimmt manchmal Verantwortung für jüngere Kinder.","Über die wirtschaftliche Situation der Familie liegen keine gesicherten Informationen vor."],transition:"Ihr arbeitet jetzt in vier Gruppen – jede mit einer eigenen Perspektive.",hints:["Die Fallgeschichte frei erzählen; Karten erscheinen pro Klick (4 Beobachtungen, dann 3 Stärken).","Betonen: Sam ist fiktiv. Und: Wir wissen nichts Gesichertes über die Finanzen der Familie."]}},{id:"gruppenarbeit",part:"B",title:"Gruppenarbeit",duration:360,steps:0,notes:{paragraphs:["Die Gruppe teilt sich in vier Kleingruppen auf. Jede Gruppe bearbeitet eine Perspektive auf den Fall Sam.","Gruppe 1 – Beobachtungen: Was wissen wir tatsächlich? Was vermuten wir?","Gruppe 2 – Belastungen: Welche möglichen Belastungen könnten eine Rolle spielen?","Gruppe 3 – Ressourcen: Welche Stärken und Schutzfaktoren erkennen wir?","Gruppe 4 – Handeln: Wie können Fachkräfte im Hort konkret handeln?","Bearbeitungszeit: 6 Minuten. Danach stellt jede Gruppe kurz ihre wichtigsten Punkte vor."],transition:"Zeit ist um – kommen wir zusammen.",hints:["Countdown oben rechts starten. Karten antippen, um den Arbeitsauftrag groß zu zeigen.","Countdown läuft weiter, auch wenn kurz zu Sam zurückgeblättert wird."]}},{id:"diskussion",part:"B",title:"Diskussion",duration:300,steps:0,notes:{paragraphs:["Die Diskussion bündelt die Ergebnisse der Gruppen.","Was wissen wir wirklich? – Beobachtung und Vermutung trennen.","Wie vermeiden wir Beschämung? – z. B. keine Gespräche über Geld vor anderen Kindern, Angebote für alle statt „Sonderlösungen“.","Welche Stärken können wir fördern? – Fußball, Zeichnen, Verantwortung für Jüngere.","Wie beziehen wir die Eltern ein? – respektvoll, ohne Vorwurf, auf Augenhöhe; Informationen etwa zum Bildungs- und Teilhabepaket anbieten.","Wo liegen unsere Grenzen? – Der Hort ersetzt keine Beratungsstelle; bei Bedarf an Fachstellen vermitteln."],transition:"Halten wir fest, was wir mitnehmen.",hints:["Karten einzeln aufdecken, je nach Verlauf. Timer oben rechts.","Die Antwortideen oben sind Impulse für dich, nicht für die Folie."],sources:["Fachtext: Erziehungs- und Bildungspartnerschaft im Wandel"]}},{id:"ergebnis",part:"B",title:"Ergebnissicherung",duration:120,steps:1,notes:{paragraphs:["Die Ergebnisse der Diskussion werden in vier Kategorien zusammengefasst.","Wahrnehmen: Beobachtungen und Vermutungen unterscheiden.","Verstehen: Lebenslagen und mögliche Hintergründe berücksichtigen.","Handeln: Beziehungen gestalten, Teilhabe ermöglichen und Eltern respektvoll beteiligen.","Stärken: Ressourcen und Selbstwirksamkeit fördern.","KERNAUSSAGE: „Kinder brauchen keine Fachkräfte, die ihre Familien vorschnell beurteilen, sondern Fachkräfte, die ihre Lebensrealitäten verstehen und ihnen Teilhabe ermöglichen.“"],hints:["In die Kreise tippen und Stichpunkte eintragen – wird automatisch im Browser gespeichert.","Mit „Weiter“ (oder Pfeiltaste, wenn kein Feld aktiv ist) erscheint die Kernaussage.","Am Ende „Als Textdatei exportieren“."]}}],ZC=[{group:"Fachliche Grundlagen",items:[{label:"Kinder- und Familienarmutsbericht Neukölln",detail:"Bezirksamt Neukölln von Berlin, Geschäftsbereich Jugend: „Für eine starke Zukunft: Kinder- und Familienarmut in Neukölln begegnen“ (1. Neuköllner Kinder- und Familienarmutsbericht), Stand 11/2025.",status:"ok",note:"SGB-II-Werte (23,1 / 33,6 / 37,3 %) im Bericht gefunden. BuT-Werte (54,4 / 31,1 %) stehen nur in Abbildungen – bitte am Original prüfen.",url:"https://www.berlin.de/ba-neukoelln/politik-und-verwaltung/aemter/jugendamt/kinderarmutsbericht-neukoelln.pdf"},{label:"Familienreport 2024",detail:"Bundesministerium für Familie, Senioren, Frauen und Jugend.",status:"pruefen",note:"Genaue bibliografische Angabe ergänzen."},{label:"Erzieherinnen + Erzieher, Band 1, Kapitel 3.5",detail:"Lehrbuch (Cornelsen).",status:"pruefen",note:"Auflage, Jahr und Kapiteltitel aus dem eigenen Exemplar ergänzen."},{label:"Erziehungs- und Bildungspartnerschaft im Wandel",detail:"Fachtext aus dem Unterricht.",status:"pruefen",note:"Autor:in und Fundstelle ergänzen."},{label:"Monitoring Soziale Stadtentwicklung Berlin 2025",detail:"Senatsverwaltung für Stadtentwicklung, Berlin.",status:"pruefen",note:"Herausgeber und Erscheinungsdatum am Original prüfen."}]},{group:"Musikalische Beispiele · künstlerische Perspektive",items:[{label:"TNF47 – Hellwach",status:"pruefen",note:"Credits und Erscheinungsjahr prüfen."},{label:"Luvre47 – Schmutz",status:"pruefen",note:"Credits und Erscheinungsjahr prüfen."},{label:"Luvre47 – Schule",status:"pruefen",note:"Credits und Erscheinungsjahr prüfen."},{label:"TNF47 & Luvre47 – Schwer erziehbar",status:"pruefen",note:"Credits und Erscheinungsjahr prüfen."},{label:"Luvre47, Bangs, Haki, Chapo & Almani – Kylie",status:"pruefen",note:"Credits und Erscheinungsjahr prüfen."},{label:"Luvre47 – Hinterm Block",status:"pruefen",note:"Songgalerie. Credits prüfen."},{label:"Luvre47 – Trümmer",status:"pruefen",note:"Songgalerie. Credits prüfen."},{label:"Luvre47 – Hamsterrad",status:"pruefen",note:"Songgalerie. Credits prüfen."},{label:"Luv en, kein spontaner Einkauf, kein eigenes Geld.",grundschule:"Schon Grundschulkinder vergleichen: Wer bekommt Taschengeld, wer kann am Kiosk etwas kaufen, wer war am Wochenende wo? Das kann Scham oder Rückzug auslösen.",hort:"Kostenfreie Angebote als Standard; Gesprächsrunden über Wochenenden und Einkäufe sensibel moderieren; Familien niedrigschwellig auf das Bildungs- und Teilhabepaket hinweisen."}},{id:"truemmer",artist:"Luvre47",title:"Trümmer",keyword:"Sozialer Vergleich",theme:"Statussymbole und soziale Ungleichheit",group:"armut",icon:"Shirt",quote:"",audio:nt("truemmer"),verified:!1,notes:{thema:"Besitz wird früh – schon auf dem Schulhof – zum Maßstab für Anerkennung unter Gleichaltrigen.",prekaer:"Wenn Kleidung, Schuhe oder Handy über Zugehörigkeit entscheiden, geraten Kinder aus Familien mit wenig Geld unter Druck. Statussymbole können auch eine Strategie sein, Mangel zu verbergen.",grundschule:"Marken und Spielzeug sind bereits im Grundschulalter Thema. Hänseleien über Kleidung sind häufige Konfliktauslöser – vgl. Sam und die Schuhe.",hort:"Anerkennung an Fähigkeiten und Beiträgen festmachen, nicht an Besitz; Hänseleien konsequent ansprechen; Regeln für fairen Umgang gemeinsam mit den Kindern erarbeiten."}},{id:"hellwach",artist:"TNF47",title:"Hellwach",keyword:"Grundbedürfnisse",theme:"Ernährung, materielle Einschränkungen, Kindheitserfahrungen",group:"armut",icon:"Utensils",quote:"",audio:nt("hellwach"),verified:!1,notes:{thema:"Unzureichende Ernährung als prägende Kindheitserfahrung – verbunden mit dem Wunsch nach einem besseren Leben.",prekaer:"Bei der Ernährung wird Armut sehr direkt spürbar. Gleichzeitig zeigt der Song Sehnsucht und Ehrgeiz, nicht nur Mangel.",grundschule:"Hunger beeinträchtigt Konzentration, Lernen und Stimmung. Kinder schämen sich oft dafür und sprechen es selten an.",hort:"Mahlzeiten als verlässlicher, würdevoller Moment; Nachschlag ohne Kommentar für alle; Familien über das BuT-Mittagessen informieren."}},{id:"hamsterrad",artist:"Luvre47",title:"Hamsterrad",keyword:"Familiäre Belastung",theme:"Familiäre Belastungen und Verantwortung",group:"armut",icon:"RefreshCw",quote:"",audio:nt("hamsterrad"),verified:!1,notes:{thema:"Ein Alltag, der viel Kraft kostet und kaum Fortschritt erlaubt – und die Frage, ob man Kinder in solche Verhältnisse setzen möchte.",prekaer:"Unsichere Arbeit, niedrige Einkommen und Dauerstress lassen wenig Raum für Planung. Das betrifft die ganze Familie – auch Eltern, die sich sehr bemühen.",grundschule:"Kinder spüren elterlichen Stress, auch wenn er nicht ausgesprochen wird. Wenig gemeinsame Zeit oder angespannte Stimmung zuhause können sich im Hort zeigen.",hort:"Eltern nicht als „unwillig“ deuten, sondern Belastung mitdenken; Elterngespräche kurz, flexibel und vorwurfsfrei; der Hort als verlässlicher, ruhiger Ort."}},{id:"schule",artist:"Luvre47 & Bangs",title:"Schule",keyword:"Zuschreibungen",theme:"Schulische Konflikte, Autorität, Stigmatisierung",group:"schule",icon:"School",quote:"",audio:nt("schule"),verified:!1,notes:{thema:"Konflikte mit Lehrkräften, die Straße bzw. der Kiez als Identität und die Erfahrung, von Erwachsenen als defizitär abgestempelt zu werden.",prekaer:"Kinder aus belasteten Lagen erleben Schule häufiger als Ort von Misserfolg und Zuschreibung. Das kann Abwehr gegenüber Bildungseinrichtungen verstärken.",grundschule:"Das Selbstbild als „schlechter Schüler“ entsteht früh. Abwertende Kommentare von Erwachsenen wirken lange nach.",hort:"Erfolgserlebnisse jenseits von Noten ermöglichen; die eigene Sprache über Kinder im Team reflektieren; mit der Schule im Interesse des Kindes kooperieren."}},{id:"schmutz",artist:"Luvre47",title:"Schmutz",keyword:"Bedürfnis hinter Verhalten",theme:"Grundbedürfnisse, Hunger und Verhalten",group:"schule",icon:"Refrigerator",quote:"",audio:nt("schmutz"),verified:!1,notes:{thema:"Normverletzendes Verhalten wird mit fehlendem Essen zuhause begründet.",prekaer:"Wenn Grundbedürfnisse nicht gedeckt sind, verschieben sich Prioritäten. Das rechtfertigt kein Verhalten, kann es aber erklärbar machen.",grundschule:"Hunger beeinflusst Konzentration und Konfliktverhalten. Ein Kind, das oft Nachschlag möchte (Sam), sendet möglicherweise ein Signal – vielleicht aber auch nicht.",hort:"Verhalten beschreiben statt bewerten; nach Bedürfnissen fragen; Zugang zu Essen ohne Beschämung sichern; wiederholte Hinweise im Team und mit den Eltern besprechen."}},{id:"schwer-erziehbar",artist:"TNF47 & Luvre47",title:"Schwer erziehbar",keyword:"Frühe Belastungen",theme:"Frühe Gewalterfahrungen und Sozialisation",group:"schule",icon:"TriangleAlert",quote:"",audio:nt("schwer-erziehbar"),verified:!1,notes:{thema:"Sehr frühe Gewalt- und Risikoerfahrungen in der Kindheit – als künstlerische Darstellung, nicht als Tatsachenbericht zu lesen.",prekaer:"Gewalt ist keine Folge von Armut. Belastete Umfelder können aber Risiken bündeln, und frühe Erfahrungen prägen die Entwicklung.",grundschule:"Grundschulkinder können bereits mit Gewalt in ihrem Umfeld konfrontiert sein, als Zeugen oder Betroffene. Das kann sich in Angst, Rückzug oder Aggression zeigen.",hort:"Sicherheit und klare Regeln geben; Gewalt nicht bagatellisieren, das Kind aber nicht etikettieren; bei Hinweisen auf eine Gefährdung das Schutzkonzept der Einrichtung bzw. § 8a SGB VIII beachten und eine insoweit erfahrene Fachkraft hinzuziehen."}},{id:"schafe-zaehlen",artist:"TNF47 & Bangs",title:"Schafe zählen",keyword:"Etiketten",theme:"Negative Fremdzuschreibungen und Stigmatisierung",group:"schule",icon:"Tag",quote:"",audio:nt("schafe-zaehlen"),verified:!1,notes:{thema:"Eine abwertende Fremdzuschreibung reduziert eine Person auf ein einziges Verhalten.",prekaer:"Kinder aus bestimmten Stadtteilen oder Familien begegnen häufiger Vorurteilen. Zuschreibungen können zur selbsterfüllenden Prophezeiung werden.",grundschule:"Etiketten wie „der Schwierige“ verbreiten sich unter Kindern und Erwachsenen schnell und sind schwer wieder loszuwerden.",hort:"Beobachtung von Deutung trennen; Kinder nie vor anderen bloßstellen; Stärken gezielt sichtbar machen; die Sprache im Team reflektieren."}},{id:"ausblick-trist",artist:"Luvre47",title:"Ausblick trist",keyword:"Früh Verantwortung",theme:"Belastete Kindheit, eingeschränkte Freizeit",group:"schule",icon:"Hourglass",quote:"",audio:nt("ausblick-trist"),verified:!1,notes:{thema:"Früh Verantwortung tragen müssen, statt unbeschwert spielen zu können.",prekaer:"In belasteten Familien übernehmen Kinder manchmal Aufgaben Erwachsener – Geschwister betreuen, übersetzen, Haushalt. Das kann Kompetenzen stärken, aber auch überfordern.",grundschule:"Solche Kinder wirken im Hort oft „sehr selbstständig“ – oder erschöpft. Spiel- und Freiräume sind für sie besonders wichtig.",hort:"Spielzeit als Recht ernst nehmen; Verantwortung anerkennen, ohne sie zu verstärken (vgl. Sam und die Jüngeren); Anzeichen von Überforderung im Team besprechen."}},{id:"todeskreis",artist:"Luvre47, Bangs & Chapo",title:"Todeskreis",keyword:"Vertrauen aufbauen",theme:"Misstrauen gegenüber pädagogischen Fachkräften",group:"ressourcen",icon:"HandHelping",quote:"",audio:nt("todeskreis"),verified:!1,notes:{thema:"Unterstützung durch pädagogische Fachkräfte wird als wirkungslos erlebt.",prekaer:"Wer wiederholt Abwertung oder Beziehungsabbrüche erlebt, erwartet von Institutionen wenig. Hilfe muss sich erst als verlässlich erweisen.",grundschule:"Auch jüngere Kinder testen, ob Erwachsene verlässlich sind. Vertrauen entsteht durch Kontinuität, nicht durch Versprechen.",hort:"Beziehungsarbeit vor Problemlösung; Zusagen einhalten; Kinder beteiligen; die eigene Rolle selbstkritisch reflektieren – auch Fachkräfte können Teil negativer Erfahrungen sein."}},{id:"kylie",artist:"Luvre47, Bangs, Haki, Chapo & Almani",title:"Kylie",keyword:"Zusammenhalt",theme:"Freundschaft und gegenseitige Unterstützung",group:"ressourcen",icon:"HeartHandshake",quote:"",audio:nt("kylie"),verified:!1,notes:{thema:"Teilen und Zusammenhalten in der Gruppe.",prekaer:"In knappen Verhältnissen sind Freundschaften oft eine zentrale Ressource: Man hilft sich mit dem, was da ist. Der Song erwähnt auch normverletzende Aspekte – Zusammenhalt ist nicht automatisch unproblematisch.",grundschule:"Freundschaften sind ein starker Schutzfaktor. Sam hat zwei enge Freundschaften – eine wichtige Ressource.",hort:"Freundschaften respektieren und stärken; kooperative Gruppenangebote; Solidarität anerkennen und in positive Bahnen lenken."}},{id:"kleine-augen",artist:"TNF47, Bangs & Luvre47",title:"Kleine Augen",keyword:"Risikoverhalten",theme:"Früher Substanzkonsum, belastende Lebensbedingungen",group:"ressourcen",icon:"Wind",quote:"",audio:nt("kleine-augen"),verified:!1,notes:{thema:"Früher Konsum – Rauchen – schon während der Schulzeit; als (problematische) Form der Bewältigung.",prekaer:"Risikoverhalten hat viele Ursachen – Gruppendruck, Vorbilder, Stressbewältigung – und darf nicht pauschal auf Armut zurückgeführt werden.",grundschule:"Auch Grundschulkinder kommen mit Rauchen und Konsum in Kontakt, meist über ältere Geschwister, Freunde oder Erwachsene.",hort:"Altersgerechte Gesundheitsförderung; Gesprächsangebote statt Moralpredigt; alternative Bewältigungs- und Freizeitangebote; Eltern einbeziehen."}}],$o=Object.fromEntries(Bi.map(e=>[e.id,e])),_C=e=>Bi.filter(t=>t.group===e).map(t=>t.id),W=[.22,1,.36,1];function Ct({text:e,className:t="",delay:n=0,stagger:i=.035,show:r=!0}){const s=e.split(" ");let o=0;return u.jsx("span",{className:t,"aria-label":e,children:s.map((a,l)=>u.jsxs("span",{className:"inline-block whitespace-nowrap","aria-hidden":!0,children:[[...a].map(c=>{const d=o++;return u.jsx(B.span,{className:"inline-block",initial:{opacity:0,y:"0.35em",filter:"blur(14px)"},animate:r?{opacity:1,y:0,filter:"blur(0px)"}:{opacity:0,y:"0.35em",filter:"blur(14px)"},transition:{duration:.9,ease:W,delay:n+d*i},children:c},d)}),l<s.length-1&&u.jsx("span",{className:"inline-block",children:" "})]},l))})}function ec({value:e,decimals:t=1,run:n
