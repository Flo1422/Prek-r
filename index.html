und Schutzfaktoren erkennen wir?",color:"#A7B8F5"},{n:4,label:"Handeln",task:"Wie können Fachkräfte im Hort konkret handeln?",color:"#E89A95"}],hint:"Karte antippen → Arbeitsauftrag"},s13:{title:"VERSTEHEN STATT VERURTEILEN.",countdown:5*60,questions:["Was wissen wir wirklich?","Wie vermeiden wir Beschämung?","Welche Stärken können wir fördern?","Wie beziehen wir die Eltern ein?","Wo liegen unsere Grenzen?"]},s14:{circles:[{key:"wahrnehmen",label:"WAHRNEHMEN.",placeholder:"Beobachtung ≠ Vermutung …",color:"#70D6C4"},{key:"verstehen",label:"VERSTEHEN.",placeholder:"Lebenslagen, Hintergründe …",color:"#A7B8F5"},{key:"handeln",label:"HANDELN.",placeholder:"Beziehung, Teilhabe, Eltern …",color:"#F3A65A"},{key:"staerken",label:"STÄRKEN.",placeholder:"Ressourcen, Selbstwirksamkeit …",color:"#E89A95"}],quote:"Kinder brauchen keine Fachkräfte, die ihre Familien vorschnell beurteilen, sondern Fachkräfte, die ihre Lebensrealitäten verstehen und ihnen Teilhabe ermöglichen.",exportTitle:"Ergebnissicherung – Fallbeispiel Sam (Gropiusstadt)"}},Ne=[{id:"gropiusstadt",part:"A",title:"Gropiusstadt",duration:45,steps:0,notes:{paragraphs:["Gropiusstadt ist ein Berliner Stadtteil mit unterschiedlichen Familien, Lebensgeschichten und sozialen Lebensbedingungen.","Der Vortrag betrachtet beispielhaft, welche Herausforderungen prekäre Lebensverhältnisse für Familien und Kinder mit sich bringen können.","Der Schwerpunkt liegt auf Kindern im Grundschulalter und der professionellen Arbeit pädagogischer Fachkräfte im Hort.","LEITFRAGE: Welche Auswirkungen können prekäre Lebensverhältnisse auf das Aufwachsen und die Teilhabe von Kindern haben – und wie können Fachkräfte im Hort unterstützen?"],transition:"Bevor wir auf Zahlen schauen: Was meinen wir eigentlich mit „prekär“?",hints:["Ablauf kurz ansagen: 10 Minuten Input, danach 15 Minuten Fallarbeit und Diskussion."]}},{id:"prekaer",part:"A",title:"Was bedeutet prekär?",duration:60,steps:5,notes:{paragraphs:["Prekäre Lebensverhältnisse beschreiben unsichere wirtschaftliche und soziale Lebensbedingungen.","Sie können geprägt sein durch geringes Einkommen, unsichere Beschäftigung, Schulden, beengte Wohnverhältnisse und eingeschränkte gesellschaftliche Teilhabe.","Dabei geht es nicht ausschließlich um finanzielle Armut. Familien können in mehreren Lebensbereichen gleichzeitig Belastungen erfahren – die fünf Fenster stehen für diese Bereiche.","Wichtig ist eine differenzierte Betrachtung: Prekäre Lebensbedingungen bedeuten nicht automatisch schlechte Elternschaft oder fehlende familiäre Unterstützung."],transition:"Wie verbreitet ist das in Gropiusstadt? Ein Blick auf die Zahlen.",hints:["Mit jedem Klick leuchtet ein Fenster auf: Geld → Wohnen → Bildung → Teilhabe → Belastung."],sources:["Erzieherinnen + Erzieher, Band 1, Kapitel 3.5","Familienreport 2024 (BMFSFJ)"]}},{id:"zahlen",part:"A",title:"Kinderarmut in Zahlen",duration:75,steps:3,notes:{paragraphs:["Laut dem Kinder- und Familienarmutsbericht Neukölln lag der Anteil der Minderjährigen im SGB-II-Bezug 2024 in Berlin bei etwa 23,1 Prozent, in Neukölln bei 33,6 Prozent und in Gropiusstadt bei 37,3 Prozent.","In Gropiusstadt betrifft dieser Indikator somit mehr als ein Drittel der Minderjährigen.","SGB-II-Bezug ist jedoch nicht mit sämtlichen Formen von Armut gleichzusetzen – Familien knapp oberhalb der Grenze oder ohne Antrag tauchen hier nicht auf.","Die Zahlen beschreiben statistische Rahmenbedingungen und keine individuellen Familien."],transition:"Was bedeuten solche Zahlen im Alltag eines Kindes?",hints:["Klick 1: Berlin · Klick 2: Neukölln · Klick 3: Gropiusstadt.","„Gropiusstadt“ ist im Bericht ein Prognoseraum. Der Bericht nennt an anderer Stelle teils leicht abweichende Werte (andere Stichtage) – bei Nachfragen darauf hinweisen."],sources:["Kinder- und Familienarmutsbericht Neukölln (Bezirksamt Neukölln, 2025)"]}},{id:"lebenswelt",part:"A",title:"Die Lebenswelt eines Kindes",duration:75,steps:4,notes:{paragraphs:["Finanzielle Einschränkungen können sich auf unterschiedliche Lebensbereiche von Kindern auswirken.","Ernährung: Nicht jeden Tag gibt es selbstverständlich ein Frühstück oder eine ausgewogene Mahlzeit.","Lernen: Beengter Wohnraum kann dazu führen, dass ein ruhiger Arbeitsplatz fehlt. Auch Kosten für Lernmaterialien können eine Hürde sein.","Freizeit: Kosten für Sportvereine, Ausflüge oder Eintritte können die Teilhabe erschweren.","Wohlbefinden: Finanzielle Sorgen können Stress und Scham auslösen – auch bei Kindern.","Diese Folgen sind nicht zwangsläufig. Familiäre Beziehungen, Freundschaften und andere Schutzfaktoren können Belastungen abfedern."],transition:"Zahlen und Fachbegriffe sind das eine. Wie klingt das, wenn jemand selbst davon erzählt?",hints:["Jeder Klick hebt einen Bereich hervor und zeigt eine mögliche Alltagssituation. Bereiche lassen sich auch direkt anklicken."],sources:["Erzieherinnen + Erzieher, Band 1, Kapitel 3.5","Familienreport 2024 (BMFSFJ)"]}},{id:"rap",part:"A",title:"Rap als Stimme der Lebenswelt",duration:75,steps:0,notes:{paragraphs:["Der Song „Hellwach“ von TNF47 thematisiert unter anderem Erfahrungen mit finanziellen Einschränkungen, Ernährung und belastenden Lebensbedingungen.","Rapmusik bietet eine subjektive, künstlerische Perspektive auf soziale Erfahrungen.","Solche Texte sind keine wissenschaftlichen Belege und nicht automatisch vollständig autobiografisch.","Sie können aber helfen, pädagogische Fragestellungen lebensnah zu verdeutlichen."],transition:"Was bedeutet es für ein Kind, wenn grundlegende Bedürfnisse nicht selbstverständlich erfüllt werden?",hints:["Audio manuell über den Player starten – Klicks auf den Player wechseln nicht die Ansicht.","Keine Songzeilen zitieren, die nicht wörtlich geprüft sind. Ausschnitt vorher auf Länge und Lautstärke testen."],sources:["TNF47 – „Hellwach“ (Credits zu prüfen)"]}},{id:"stigma",part:"A",title:"Stigmatisierung",duration:60,steps:2,notes:{paragraphs:["In den Songs „Schmutz“, „Schule“ und „Schwer erziehbar“ werden unter anderem negative Zuschreibungen, schulische Konflikte und Erfahrungen mit Autoritätspersonen thematisiert.","Pädagogische Fachkräfte müssen zwischen Beobachtungen und Interpretationen unterscheiden.","Verhalten kann unterschiedliche Ursachen haben. Ein Kind sollte nicht durch negative Etiketten auf bestimmte Eigenschaften reduziert werden.","Die professionelle Aufgabe besteht darin, das Verhalten wahrzunehmen, mögliche Hintergründe zu verstehen und angemessen zu handeln."],transition:"Wer nur auf Defizite schaut, übersieht etwas Entscheidendes.",hints:["Klick 1: Stempel bricht auf → „Oder in Schwierigkeiten?“ · Klick 2: Kernaussage."],sources:["Luvre47 – „Schmutz“","Luvre47 – „Schule“","TNF47 & Luvre47 – „Schwer erziehbar“ (Credits zu prüfen)"]}},{id:"ressourcen",part:"A",title:"Ressourcen",duration:60,steps:2,notes:{paragraphs:["Der Song „Kylie“ von Luvre47, Bangs, Haki, Chapo und Almani thematisiert unter anderem Zusammenhalt, Freundschaft und gegenseitige Unterstützung.","Diese Perspektive ist wichtig, weil Familien und Kinder nicht ausschließlich über Defizite betrachtet werden dürfen.","Soziale Beziehungen, Interessen, Kreativität und positive Gruppenerfahrungen können wichtige Ressourcen sein.","Pädagogische Fachkräfte sollten vorhandene Stärken erkennen und fördern."],transition:"Damit Stärken sich entfalten können, braucht es Zugang. Stichwort: Teilhabe.",hints:["Klick 1: Szene wird hell, Netzwerk entsteht · Klick 2: Schlagwörter."],sources:["Luvre47, Bangs, Haki, Chapo & Almani – „Kylie“ (Credits zu prüfen)"]}},{id:"teilhabe",part:"A",title:"Bildung und Teilhabe",duration:50,steps:2,notes:{paragraphs:["2024 hatten in Neukölln 54,4 Prozent der Grundschülerinnen und Grundschüler Anspruch auf Leistungen aus dem Bildungs- und Teilhabepaket. Berlinweit waren es 31,1 Prozent.","Diese Zahlen beziehen sich auf Neukölln insgesamt, nicht ausschließlich auf Gropiusstadt.","Das Bildungs- und Teilhabepaket kann unter anderem Unterstützung bei Mittagessen, Ausflügen, Schulbedarf, Lernförderung und Freizeitaktivitäten ermöglichen.","Pädagogische Fachkräfte können Familien informieren und Teilhabebarrieren reduzieren."],transition:"Was heißt das konkret für unser Handeln im Hort?",hints:["Klick 1: Neukölln · Klick 2: Berlin.","ZU PRÜFEN: Die BuT-Werte (54,4 % / 31,1 %) stehen im Bericht in Abbildungen (ca. S. 63–64). Vor dem Vortrag dort abgleichen."],sources:["Kinder- und Familienarmutsbericht Neukölln (Bezirksamt Neukölln, 2025)"]}},{id:"handeln",part:"A",title:"Pädagogisches Handeln",duration:70,steps:5,notes:{paragraphs:["Pädagogische Fachkräfte im Hort können Kinder und Familien auf unterschiedliche Weise unterstützen.","Beobachten: aufmerksam wahrnehmen und Beobachtung von Deutung trennen.","Vertrauen: eine wertschätzende Haltung und verlässliche Beziehungen.","Beteiligen: niedrigschwellige Teilhabemöglichkeiten schaffen – etwa kostenfreie Angebote.","Stärken: ressourcenorientierte Angebote, die an Interessen der Kinder anknüpfen.","Begleiten: eine respektvolle Erziehungs- und Bildungspartnerschaft mit den Eltern.","Der Hort kann finanzielle Armut nicht allein beseitigen, aber konkrete Benachteiligungen im pädagogischen Alltag verringern."],transition:"Genug Theorie.",hints:["Jeder Klick hebt ein Handlungsfeld hervor. Felder lassen sich auch direkt anklicken."],sources:["Fachtext: Erziehungs- und Bildungspartnerschaft im Wandel","Erzieherinnen + Erzieher, Band 1, Kapitel 3.5"]}},{id:"uebergang",part:"A",title:"Übergang zur Praxis",duration:30,steps:1,notes:{paragraphs:["Nach der theoretischen Auseinandersetzung folgt eine fiktive Handlungssituation.","Die Studierenden sollen das Gelernte auf eine konkrete Situation aus dem Hortalltag übertragen."],transition:"Ich stelle euch Sam vor.",hints:["Klick: Die große Frage erscheint. Kurz Pause lassen.","Ab hier beginnt Teil B (15 Minuten)."]}},{id:"sam",part:"B",title:"Fallbeispiel Sam",duration:120,steps:7,notes:{paragraphs:["Sam ist zehn Jahre alt, besucht die vierte Klasse und geht nach der Schule in einen Hort in Gropiusstadt.","Seit einigen Wochen fragt Sam beim Mittagessen häufig nach einer zusätzlichen Portion.","Sam trägt seit längerer Zeit dieselben abgenutzten Schuhe und konnte an einem kostenpflichtigen Ausflug nicht teilnehmen.","In Gruppensituationen kommt es gelegentlich zu Streit. Einmal reagierte Sam sehr wütend, als andere Kinder über die Schuhe lachten.","Gleichzeitig spielt Sam leidenschaftlich Fußball, zeichnet gern und hat zwei enge Freundschaften.","Bei kreativen Projekten zeigt Sam viel Ausdauer und übernimmt manchmal Verantwortung für jüngere Kinder.","Über die wirtschaftliche Situation der Familie liegen keine gesicherten Informationen vor."],transition:"Ihr arbeitet jetzt in vier Gruppen – jede mit einer eigenen Perspektive.",hints:["Die Fallgeschichte frei erzählen; Karten erscheinen pro Klick (4 Beobachtungen, dann 3 Stärken).","Betonen: Sam ist fiktiv. Und: Wir wissen nichts Gesichertes über die Finanzen der Familie."]}},{id:"gruppenarbeit",part:"B",title:"Gruppenarbeit",duration:360,steps:0,notes:{paragraphs:["Die Gruppe teilt sich in vier Kleingruppen auf. Jede Gruppe bearbeitet eine Perspektive auf den Fall Sam.","Gruppe 1 – Beobachtungen: Was wissen wir tatsächlich? Was vermuten wir?","Gruppe 2 – Belastungen: Welche möglichen Belastungen könnten eine Rolle spielen?","Gruppe 3 – Ressourcen: Welche Stärken und Schutzfaktoren erkennen wir?","Gruppe 4 – Handeln: Wie können Fachkräfte im Hort konkret handeln?","Bearbeitungszeit: 6 Minuten. Danach stellt jede Gruppe kurz ihre wichtigsten Punkte vor."],transition:"Zeit ist um – kommen wir zusammen.",hints:["Countdown oben rechts starten. Karten antippen, um den Arbeitsauftrag groß zu zeigen.","Countdown läuft weiter, auch wenn kurz zu Sam zurückgeblättert wird."]}},{id:"diskussion",part:"B",title:"Diskussion",duration:300,steps:0,notes:{paragraphs:["Die Diskussion bündelt die Ergebnisse der Gruppen.","Was wissen wir wirklich? – Beobachtung und Vermutung trennen.","Wie vermeiden wir Beschämung? – z. B. keine Gespräche über Geld vor anderen Kindern, Angebote für alle statt „Sonderlösungen“.","Welche Stärken können wir fördern? – Fußball, Zeichnen, Verantwortung für Jüngere.","Wie beziehen wir die Eltern ein? – respektvoll, ohne Vorwurf, auf Augenhöhe; Informationen etwa zum Bildungs- und Teilhabepaket anbieten.","Wo liegen unsere Grenzen? – Der Hort ersetzt keine Beratungsstelle; bei Bedarf an Fachstellen vermitteln."],transition:"Halten wir fest, was wir mitnehmen.",hints:["Karten einzeln aufdecken, je nach Verlauf. Timer oben rechts.","Die Antwortideen oben sind Impulse für dich, nicht für die Folie."],sources:["Fachtext: Erziehungs- und Bildungspartnerschaft im Wandel"]}},{id:"ergebnis",part:"B",title:"Ergebnissicherung",duration:120,steps:1,notes:{paragraphs:["Die Ergebnisse der Diskussion werden in vier Kategorien zusammengefasst.","Wahrnehmen: Beobachtungen und Vermutungen unterscheiden.","Verstehen: Lebenslagen und mögliche Hintergründe berücksichtigen.","Handeln: Beziehungen gestalten, Teilhabe ermöglichen und Eltern respektvoll beteiligen.","Stärken: Ressourcen und Selbstwirksamkeit fördern.","KERNAUSSAGE: „Kinder brauchen keine Fachkräfte, die ihre Familien vorschnell beurteilen, sondern Fachkräfte, die ihre Lebensrealitäten verstehen und ihnen Teilhabe ermöglichen.“"],hints:["In die Kreise tippen und Stichpunkte eintragen – wird automatisch im Browser gespeichert.","Mit „Weiter“ (oder Pfeiltaste, wenn kein Feld aktiv ist) erscheint die Kernaussage.","Am Ende „Als Textdatei exportieren“."]}}],f3=[{group:"Fachliche Grundlagen",items:[{label:"Kinder- und Familienarmutsbericht Neukölln",detail:"Bezirksamt Neukölln von Berlin, Geschäftsbereich Jugend: „Für eine starke Zukunft: Kinder- und Familienarmut in Neukölln begegnen“ (1. Neuköllner Kinder- und Familienarmutsbericht), Stand 11/2025.",status:"ok",note:"SGB-II-Werte (23,1 / 33,6 / 37,3 %) im Bericht gefunden. BuT-Werte (54,4 / 31,1 %) stehen nur in Abbildungen – bitt
